<body>

    <div class="container">
        <header class="header">

        <div class="btn info-banner">

        </a>
        
        <div class="btn" onclick="sharePage()">
            <img src="assets/img/icons/share.webp" alt="Instagram" class="product-thumb" >

        </div>

        <section class="products-section">
            <h3 class="section-title">Produtos em destaque</h3>

            <div class="products-list">
                <a href="LINK_PRODUTO_COM_UTM" target="_blank" rel="noopener" class="btn product-btn">
                    <img src="assets/img/logo/favicon.webp" alt="Shimano Caius" class="product-thumb" loading="lazy">
                    <div class="product-info">

        <footer class="footer">

        </footer>

    </div>

    <script>
        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: 'Garimpo da Pesca',
                    text: 'Dá uma olhada nessas ofertas de pesca que encontrei!',
                    url: window.location.href
                }).then(() => {
                    console.log('Compartilhado com sucesso!');
                }).catch((error) => {
                    console.log('Erro ao compartilhar:', error);
                });
            } else {
                // Fallback para navegadores que não suportam a API (copiar link)
                navigator.clipboard.writeText(window.location.href);
                alert("Link copiado! Agora é só enviar para seus amigos.");
            }
        }
        const notifications = [
    { name: "Ricardo S.", city: "Canoas - RS" },
    { name: "Mateus G.", city: "São Leopoldo - RS" },
    { name: "Carlos Henrique", city: "Porto Alegre - RS" },
    { name: "Felipe Silva", city: "Novo Hamburgo - RS" },
    { name: "Anderson P.", city: "Imbé - RS" },
    { name: "João V.", city: "Tramandaí - RS" }
];

function showNotification() {
    const container = document.createElement('div');
    container.id = 'social-proof-float';
    container.innerHTML = `
        <div class="user-img">🎣</div>
        <div class="proof-text">
            <strong id="proof-name"></strong>
            <span id="proof-city">acabou de entrar no grupo!</span>
        </div>
    `;
    document.body.appendChild(container);

    const notify = () => {
        const data = notifications[Math.floor(Math.random() * notifications.length)];
        document.getElementById('proof-name').innerText = data.name;
        document.getElementById('proof-city').innerText = `${data.city} acabou de entrar no grupo`;
        
        container.classList.add('active');
        
        setTimeout(() => {
            container.classList.remove('active');
        }, 5000); // Fica visível por 5 segundos
    };

    // Primeira exibição após 3 segundos
    setTimeout(notify, 3000);
    
    // Repete a cada 12 a 20 segundos para não parecer robótico
    setInterval(notify, Math.floor(Math.random() * (20000 - 12000 + 1)) + 12000);
}

window.onload = showNotification;
    </script>
